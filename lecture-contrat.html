<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votre intervention — Perfect Agence Service</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#20282b; --paper:#f6f3ec; --panel:#ffffff;
    --navy:#0f2e38; --navy-deep:#081319;
    --gold:#c9a24a; --gold-light:#e8cf8a;
    --amber:#e0972f; --green:#2f9e5c; --green-dark:#1f7a45; --red:#b5451c; --line:#d9d2c1; --muted:#6b6459;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Inter', -apple-system, 'Segoe UI', Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
  }
  .display{ font-family:'Space Grotesk', sans-serif; }
  header{
    background:linear-gradient(180deg, var(--navy-deep), var(--navy));
    color:#f2efe6; text-align:center; padding:26px 20px 20px;
  }
  header .brand{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:20px; letter-spacing:.2px; }
  header .sub{ font-size:12.5px; color:var(--gold-light); margin-top:2px; }
  .warn-banner{
    margin:14px 16px 0; background:linear-gradient(135deg,#3a2a08,#241a05);
    border:1px solid var(--gold); border-radius:10px; padding:12px 14px;
    font-size:13px; color:var(--gold-light); text-align:center; font-weight:700;
  }
  main{ max-width:460px; margin:0 auto; padding:18px 16px; }
  .greet{ text-align:center; margin:6px 0 18px; }
  .greet .hello{ font-size:13px; color:var(--muted); }
  .greet .name{ font-family:'Space Grotesk', sans-serif; font-size:26px; font-weight:700; color:var(--navy); }
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:18px; margin-bottom:16px; box-shadow:0 6px 20px rgba(15,46,56,0.06);
  }
  .card .titre{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:15px; color:var(--navy); margin-bottom:12px; }
  .row{ display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid #eee5d0; font-size:14px; }
  .row:last-child{ border-bottom:none; }
  .row .k{ color:var(--muted); }
  .row .v{ font-weight:600; text-align:right; }
  .prest-list{ font-size:13.5px; color:var(--ink); line-height:1.6; }

  .montant-card{
    background:linear-gradient(135deg, var(--navy-deep), var(--navy));
    color:#fff; border-radius:16px; padding:22px 20px; text-align:center; margin-bottom:16px;
  }
  .montant-card .lbl{ font-size:12px; color:var(--gold-light); font-weight:700; letter-spacing:.5px; margin-bottom:4px; }
  .montant-card .val-total{ font-size:15px; color:rgba(255,255,255,0.55); text-decoration:line-through; }
  .montant-card .val-net{ font-family:'Space Grotesk', sans-serif; font-size:32px; font-weight:700; color:#fff; margin:4px 0; }
  .acompte-box{
    margin-top:14px; background:rgba(224,151,47,0.15); border:1.5px solid var(--amber);
    border-radius:12px; padding:14px;
  }
  .acompte-box .lbl2{ font-size:12px; color:var(--gold-light); font-weight:700; }
  .acompte-box .val2{ font-family:'Space Grotesk', sans-serif; font-size:26px; font-weight:800; color:#fff; margin-top:2px; }
  .solde-line{ font-size:12px; color:rgba(255,255,255,0.6); margin-top:10px; }

  .sig-card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; }
  .sig-card .titre{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:16px; color:var(--navy); margin-bottom:4px; text-align:center; }
  .sig-card .hint{ font-size:12.5px; color:var(--muted); text-align:center; margin-bottom:12px; }
  #sig-canvas{
    width:100%; height:160px; background:#fdfcf8; border:2px dashed var(--line);
    border-radius:10px; touch-action:none; cursor:crosshair; display:block;
  }
  .sig-clear{
    display:block; margin:10px auto 0; font-size:13px; color:var(--navy);
    background:none; border:none; font-weight:700; cursor:pointer; text-decoration:underline;
  }
  .certif-text{
    font-size:12px; color:var(--muted); text-align:center; line-height:1.5;
    padding:0 10px; margin-bottom:16px;
  }

  .btn-accept{
    width:100%; padding:20px; border-radius:14px; border:none;
    font-family:'Space Grotesk', sans-serif; font-size:18px; font-weight:700; cursor:pointer;
    background:#b9b2a0; color:#fff; transition:.2s;
    display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .btn-accept.ready{ background:linear-gradient(135deg, var(--green), var(--green-dark)); box-shadow:0 10px 28px rgba(47,158,92,0.4); }
  .btn-accept .sub2{ font-family:'Inter',sans-serif; font-weight:500; font-size:11.5px; opacity:.9; }
  .btn-accept:disabled{ cursor:not-allowed; }

  .result-box{
    text-align:center; padding:40px 22px; background:linear-gradient(180deg, var(--navy-deep), var(--navy));
    color:#fff; border-radius:18px;
  }
  .result-box .emoji{ font-size:46px; margin-bottom:10px; }
  .result-box h3{ font-family:'Space Grotesk', sans-serif; font-size:22px; margin-bottom:8px; }
  .result-box p{ font-size:13.5px; color:rgba(255,255,255,0.7); margin-bottom:20px; }
  .state-box{ text-align:center; padding:60px 20px; font-size:14px; color:var(--muted); }

  /* ---------- Animations d'entrée ---------- */
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(16px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .greet, .card, .montant-card, .sig-card, .certif-text, .btn-accept{
    animation: fadeUp .6s cubic-bezier(.22,.61,.36,1) both;
  }
  .greet{ animation-delay:.02s; }
  .card{ animation-delay:.10s; }
  .montant-card{ animation-delay:.20s; }
  .sig-card{ animation-delay:.30s; }
  .certif-text{ animation-delay:.38s; }
  .btn-accept{ animation-delay:.44s; }

  @keyframes glowPulse{
    0%, 100%{ box-shadow:0 0 0 0 rgba(224,151,47,0.35); }
    50%{ box-shadow:0 0 0 8px rgba(224,151,47,0); }
  }
  .acompte-box{ animation: glowPulse 2.6s ease-in-out infinite; }

  .btn-accept{ transform:scale(1); }
  .btn-accept.ready{ animation: fadeUp .6s cubic-bezier(.22,.61,.36,1) both, readyPop .4s ease .05s; }
  @keyframes readyPop{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.035); }
    100%{ transform:scale(1); }
  }
  .btn-accept:active:not(:disabled){ transform:scale(0.97); }

  @keyframes resultIn{
    from{ opacity:0; transform:scale(.94); }
    to{ opacity:1; transform:scale(1); }
  }
  .result-box{ animation: resultIn .5s cubic-bezier(.22,.61,.36,1) both; }
  @keyframes emojiPop{
    0%{ transform:scale(0); }
    60%{ transform:scale(1.25); }
    100%{ transform:scale(1); }
  }
  .result-box .emoji{ display:inline-block; animation: emojiPop .55s cubic-bezier(.34,1.56,.64,1) .15s both; }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">Perfect Agence Service</div>
  <div class="sub">Fiche d'intervention TNT / Satellite &amp; SAV</div>
</header>
<div class="warn-banner">⚠️ Frais de validation obligatoire : 20% du montant à régler pour valider l'intervention</div>

<main id="content">
  <div class="state-box">Chargement de votre contrat...</div>
</main>

<script type="module">
import { db, doc, getDoc, updateDoc } from "./firebase-config.js";

function formatFCFA(n){
  return Math.round(n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " FCFA";
}
function esc(s){
  return String(s||'').replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

/* ---------- Variables du pad de signature (déclarées tôt : utilisées dès l'affichage) ---------- */
let canvas, ctx, hasSig = false, drawing = false;

const params = new URLSearchParams(window.location.search);
const ficheId = params.get('id');
const content = document.getElementById('content');
let data = null;

async function charger(){
  if(!ficheId){
    content.innerHTML = '<div class="state-box">Lien invalide ou incomplet.</div>';
    return;
  }
  try{
    const snap = await getDoc(doc(db, "fiches", ficheId));
    if(!snap.exists()){
      content.innerHTML = '<div class="state-box">Cette fiche est introuvable. Contactez Perfect Agence Service.</div>';
      return;
    }
    data = snap.data();
    if(data.statutClient === 'accepte' && data.accepteAt){
      afficherResultatDejaSigne();
    } else {
      afficherContrat();
    }
  }catch(e){
    content.innerHTML = '<div class="state-box">Impossible de charger cette fiche. Vérifiez votre connexion internet.</div>';
  }
}

function afficherContrat(){
  const prestationsHtml = (data.pr || []).map(p => {
    const label = p[0], prix = p[1], devis = p[2];
    return devis ? `• ${esc(label)} <em>(sur devis)</em>` : `• ${esc(label)} — ${formatFCFA(prix)}`;
  }).join('<br>');

  content.innerHTML = `
    <div class="greet">
      <div class="hello">Bonjour</div>
      <div class="name">${esc(data.n)}</div>
    </div>

    <div class="card">
      <div class="titre">📋 Détails de l'intervention</div>
      <div class="row"><span class="k">Réf. intervention</span><span class="v">${esc(data.ref)}</span></div>
      <div class="row"><span class="k">Type</span><span class="v">${esc(data.ty)}</span></div>
      ${data.z ? `<div class="row"><span class="k">Zone</span><span class="v">${esc(data.z)}</span></div>` : ''}
      ${data.fl ? `<div class="row"><span class="k">Formule</span><span class="v">${esc(data.fl)}</span></div>` : ''}
      <div class="row" style="flex-direction:column; align-items:flex-start; gap:6px;">
        <span class="k">Prestations</span>
        <span class="prest-list">${prestationsHtml}</span>
      </div>
      ${data.ga ? `<div class="row" style="flex-direction:column; align-items:flex-start; gap:6px;"><span class="k">🛡️ Garantie</span><span class="prest-list" style="font-weight:600; color:var(--navy);">${esc(data.ga)}</span></div>` : ''}
      ${data.db ? `<div class="row"><span class="k">Début</span><span class="v">${esc(data.db)}${data.hr ? ' à '+esc(data.hr) : ''}</span></div>` : ''}
      ${data.du ? `<div class="row"><span class="k">Durée</span><span class="v">${esc(data.du)}</span></div>` : ''}
      ${data.ds ? `<div class="row"><span class="k">Délai SAV</span><span class="v">${esc(data.ds)}</span></div>` : ''}
    </div>

    <div class="montant-card">
      <div class="lbl">MONTANT À PAYER</div>
      ${data.re > 0 ? `<div class="val-total">${formatFCFA(data.to)}</div>` : ''}
      <div class="val-net">${formatFCFA(data.ne)}</div>
      ${data.re > 0 ? `<div style="font-size:12px; color:var(--gold-light);">Remise appliquée : − ${formatFCFA(data.re)}</div>` : ''}

      <div class="acompte-box">
        <div class="lbl2">⚠️ FRAIS DE VALIDATION (20%) — À RÉGLER MAINTENANT</div>
        <div class="val2">${formatFCFA(data.ac)}</div>
      </div>
      <div class="solde-line">Solde de ${formatFCFA(data.so)} à régler après l'intervention</div>
    </div>

    <div class="sig-card">
      <div class="titre">✍️ Votre signature</div>
      <div class="hint">Faites un trait avec le doigt pour signer</div>
      <canvas id="sig-canvas"></canvas>
      <button type="button" class="sig-clear" onclick="effacerSignature()">Effacer la signature</button>
    </div>

    <div class="certif-text">
      Je certifie l'exactitude des informations ci-dessus et j'accepte les conditions de la présente intervention.
    </div>

    <button class="btn-accept" id="btn-accepter" onclick="accepter()" disabled>
      ✅ J'ACCEPTE CETTE INTERVENTION
      <span class="sub2">Signez d'abord ci-dessus</span>
    </button>
  `;
  initSignaturePad();
}

/* ---------- Pad de signature ---------- */
function initSignaturePad(){
  canvas = document.getElementById('sig-canvas');
  if(!canvas) return;
  const rect = canvas.getBoundingClientRect();
  const ratio = window.devicePixelRatio || 1;
  canvas.width = rect.width * ratio;
  canvas.height = rect.height * ratio;
  ctx = canvas.getContext('2d');
  ctx.scale(ratio, ratio);
  ctx.strokeStyle = '#20282b';
  ctx.lineWidth = 2.4;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const pos = (e) => {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  };
  canvas.addEventListener('pointerdown', (e) => {
    drawing = true;
    const p = pos(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  });
  canvas.addEventListener('pointermove', (e) => {
    if(!drawing) return;
    const p = pos(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    if(!hasSig){
      hasSig = true;
      const btn = document.getElementById('btn-accepter');
      btn.disabled = false;
      btn.classList.add('ready');
    }
  });
  window.addEventListener('pointerup', () => { drawing = false; });
}
window.effacerSignature = function(){
  if(!ctx) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  hasSig = false;
  const btn = document.getElementById('btn-accepter');
  btn.disabled = true;
  btn.classList.remove('ready');
};

/* ---------- PDF ---------- */
function genererPdf(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });

  doc.setFillColor(15,46,56);
  doc.rect(0, 0, 210, 30, 'F');
  doc.setTextColor(201,162,74);
  doc.setFontSize(16);
  doc.setFont(undefined, 'bold');
  doc.text('PERFECT AGENCE SERVICE', 14, 14);
  doc.setFontSize(9);
  doc.setFont(undefined, 'normal');
  doc.text("Fiche d'intervention TNT / Satellite & SAV — Réf. " + data.ref, 14, 21);

  doc.setTextColor(30,30,30);
  let y = 42;
  const ligne = (label, val) => {
    doc.setFont(undefined, 'bold'); doc.setFontSize(10);
    doc.text(label, 14, y);
    doc.setFont(undefined, 'normal');
    doc.text(String(val || '—'), 80, y, { maxWidth: 116 });
    y += 8;
  };
  ligne('Client', data.n);
  ligne('Téléphone', data.t);
  ligne('Adresse', (data.a||'') + (data.v ? ', '+data.v : ''));
  ligne("Type d'intervention", data.ty);
  if(data.z) ligne('Zone', data.z);
  if(data.fl) ligne('Formule', data.fl);
  if(data.ga){
    doc.setFont(undefined, 'bold'); doc.setFontSize(10);
    doc.text('Garantie', 14, y);
    doc.setFont(undefined, 'normal');
    const gaLines = doc.splitTextToSize(String(data.ga), 116);
    doc.text(gaLines, 80, y);
    y += Math.max(8, gaLines.length * 5);
  }
  y += 2;
  doc.setFont(undefined,'bold'); doc.setFontSize(11);
  doc.text('Prestations', 14, y); y += 7;
  doc.setFont(undefined,'normal'); doc.setFontSize(9.5);
  (data.pr||[]).forEach(p=>{
    const txt = p[2] ? `• ${p[0]} (sur devis)` : `• ${p[0]} — ${formatFCFA(p[1])}`;
    doc.text(txt, 16, y, { maxWidth: 180 });
    y += 6;
  });
  y += 4;
  if(data.db) { ligne('Début', data.db + (data.hr ? ' à '+data.hr : '')); }
  if(data.du) { ligne('Durée', data.du); }
  if(data.ds) { ligne('Délai SAV', data.ds); }
  if(data.co) { ligne('Conditions', data.co); }

  y += 4;
  doc.setFillColor(240,216,120);
  doc.rect(14, y-6, 182, 34, 'F');
  doc.setTextColor(30,30,30);
  doc.setFontSize(10); doc.setFont(undefined,'bold');
  doc.text('MONTANT NET :', 18, y+2);
  doc.setFontSize(12);
  doc.text(formatFCFA(data.ne), 140, y+2);
  if(data.re > 0){
    doc.setFontSize(9); doc.setFont(undefined,'normal');
    doc.text('(Remise appliquée : -' + formatFCFA(data.re) + ')', 18, y+9);
  }
  doc.setFontSize(10); doc.setFont(undefined,'bold');
  doc.text('FRAIS DE VALIDATION (20%, à régler maintenant) :', 18, y+18);
  doc.text(formatFCFA(data.ac), 140, y+18);
  doc.setFont(undefined,'normal'); doc.setFontSize(9);
  doc.text('Solde après intervention : ' + formatFCFA(data.so), 18, y+25);
  y += 40;

  doc.setTextColor(30,120,60);
  doc.setFont(undefined,'bold'); doc.setFontSize(10);
  doc.text('✓ Intervention validée et signée le ' + new Date().toLocaleDateString('fr-FR'), 14, y);
  y += 6;
  doc.setTextColor(90,90,90);
  doc.setFont(undefined,'italic'); doc.setFontSize(8.5);
  doc.text("Je certifie l'exactitude des informations ci-dessus et j'accepte les conditions de la présente intervention.", 14, y, { maxWidth: 182 });
  y += 8;
  if(window.__sigData){
    try{ doc.addImage(window.__sigData, 'PNG', 14, y, 60, 25); }catch(e){}
  }

  doc.setFontSize(8);
  doc.setTextColor(150,150,150);
  doc.text('Document généré automatiquement — Perfect Agence Service', 14, 285);

  return doc;
}

/* ---------- Acceptation ---------- */
async function accepter(){
  if(!hasSig) return;
  window.__sigData = canvas.toDataURL('image/png');
  const accepteAt = new Date().toISOString();

  const btn = document.getElementById('btn-accepter');
  if(btn){ btn.disabled = true; btn.textContent = '⏳ Enregistrement...'; }

  try{
    await updateDoc(doc(db, "fiches", ficheId), {
      statutClient: 'accepte',
      accepteAt: accepteAt,
      signatureData: window.__sigData
    });
  }catch(e){
    alert("Erreur lors de l'enregistrement de votre signature. Vérifiez votre connexion internet et réessayez.");
    if(btn){ btn.disabled = false; btn.textContent = "✅ J'ACCEPTE CETTE INTERVENTION"; }
    return;
  }

  data.accepteAt = accepteAt;
  data.signatureData = window.__sigData;

  content.innerHTML = `
    <div class="result-box">
      <div class="emoji">✅</div>
      <h3>Intervention validée</h3>
      <p>Merci ${esc(data.n)} ! Votre copie PDF va se télécharger. Perfect Agence Service va être notifié automatiquement.</p>
    </div>
  `;

  const pdfDoc = genererPdf();
  pdfDoc.save('Intervention-' + data.ref + '.pdf');

  const msg = `✅ *Intervention validée et signée*\n` +
    `Réf : ${data.ref}\n\n` +
    `👤 Client : ${data.n}\n` +
    `📞 Tél : ${data.t}\n` +
    `💰 Montant net : ${formatFCFA(data.ne)}\n` +
    `⚠️ Frais de validation (20%) à récupérer : ${formatFCFA(data.ac)}\n` +
    `💵 Solde après intervention : ${formatFCFA(data.so)}\n\n` +
    `Le client a signé électroniquement depuis son téléphone.`;

  setTimeout(() => {
    window.open('https://wa.me/2250707470833?text=' + encodeURIComponent(msg), '_blank');
  }, 900);
}
window.accepter = accepter;

function afficherResultatDejaSigne(){
  content.innerHTML = `
    <div class="result-box">
      <div class="emoji">✅</div>
      <h3>Intervention déjà validée</h3>
      <p>Bonjour ${esc(data.n)}, cette fiche a déjà été signée le ${new Date(data.accepteAt).toLocaleDateString('fr-FR')}. Vous pouvez retélécharger votre copie ci-dessous.</p>
      <button class="btn-accept ready" style="max-width:320px; margin:0 auto;" onclick="retelecharger()">📄 Retélécharger mon PDF</button>
    </div>
  `;
}
window.retelecharger = function(){
  window.__sigData = data.signatureData;
  const pdfDoc = genererPdf();
  pdfDoc.save('Intervention-' + data.ref + '.pdf');
};

charger();
</script>
</body>
</html>
